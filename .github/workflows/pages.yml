name: Build and publish AgroMax Phase 2
on:
  workflow_dispatch:
  push:
    branches: [main, phase2-cinematic-portal]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: agromax-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build complete static site
        run: npm run lint && npm run typecheck && npm run build && npm run check
        env:
          BASE_PATH: /tarim2/
          SITE_ORIGIN: https://rumelifatihi51.github.io
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
